      - 4 · IDS Suricata:
          - Writeup 10: writeup/10-scenario-suricata-nids.md
          - Fiche: scenarios/suricata-nids.md
      - 5 · Accès aux identifiants (LSASS):
          - Writeup 15 (en cours): writeup/15-detection-acces-identifiants-lsass.md
      - 5b · Persistance clé Run:
          - Writeup 11: writeup/11-scenario-persistance-run-key.md
          - Fiche: scenarios/persistance-run-key.md
      - 6 · Mouvement latéral SMB:
          - Writeup 16: writeup/16-scenario-mouvement-lateral-smb.md
          - Fiche: scenarios/mouvement-lateral-smb.md
      - 7 · Effacement des journaux:
          - Writeup 17 (en cours): writeup/17-scenario-effacement-journaux.md
      - 8 · Suppression des clichés (Impact):
          - Writeup 19: writeup/19-scenario-suppression-cliches.md
      - 9 · PowerShell encodé (Execution):
          - Writeup 20: writeup/20-scenario-powershell-encode.md
      - 10 · Tâche planifiée SYSTEM (Privilege Escalation):
