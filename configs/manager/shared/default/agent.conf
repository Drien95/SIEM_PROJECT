<!--
  Configuration centralisée du groupe « default » :
  /var/ossec/etc/shared/default/agent.conf (manager). Téléchargée par chaque agent du groupe.
  Vérifier avec /var/ossec/bin/verify-agent-conf avant de redémarrer le manager.
-->
<agent_config os="Windows">
  <!-- Sysmon : canal d'événements dédié (writeup 04, § 5.2). -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <!-- Microsoft Defender : détections 1116/1117 (writeup 24). Sans ce canal, un
       blocage par l'antivirus est invisible pour Wazuh. -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
